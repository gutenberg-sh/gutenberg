services:
  postgres:
    image: postgres:16-alpine
    container_name: gutenberg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${GUTENBERG_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${GUTENBERG_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${GUTENBERG_POSTGRES_DB:-gutenberg}
    ports:
      - '${GUTENBERG_POSTGRES_PORT:-5432}:5432'
    volumes:
      - gutenberg-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "${POSTGRES_USER:-postgres}" -d "${POSTGRES_DB:-gutenberg}"',
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  solana-validator:
    image: ghcr.io/beeman/solana-test-validator:latest
    container_name: gutenberg-solana-validator
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    ports:
      - '${GUTENBERG_SOLANA_RPC_PORT:-8899}:8899'
      - '${GUTENBERG_SOLANA_WS_PORT:-8900}:8900'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'solana cluster-version -u http://127.0.0.1:8899 || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  gutenberg-postgres-data:
