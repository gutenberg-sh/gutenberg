<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0a0b0e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafbfc" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Gutenberg — verified releases on Solana</title>
    <meta
      name="description"
      content="Verify and read any release recorded on the Gutenberg registry. Manifest signatures, bundle hashes, and per-file hashes are checked locally in your browser."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var t = document.documentElement;
          var saved = localStorage.getItem('gutenberg-theme');
          var prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)'
          ).matches;
          if (saved === 'dark' || (saved !== 'light' && prefersDark)) {
            t.classList.add('dark');
            t.classList.remove('light');
          } else {
            t.classList.add('light');
            t.classList.remove('dark');
          }
        } catch (e) {
          console.error(e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
