<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0a0b0e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafbfc" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Gutenberg — verified releases on Solana</title>
    <meta
      name="description"
      content="Verify and read any release recorded on the Gutenberg registry. Manifest signatures, bundle hashes, and per-file hashes are checked locally in your browser."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var saved = localStorage.getItem('gutenberg-theme');

          // Only stamp an explicit class when the user has chosen a theme.
          // Otherwise leave it unset so the CSS `prefers-color-scheme`
          // media query reacts live to OS theme changes.
          if (saved === 'dark') {
            root.classList.add('dark');
            root.classList.remove('light');
          } else if (saved === 'light') {
            root.classList.add('light');
            root.classList.remove('dark');
          } else {
            root.classList.remove('dark');
            root.classList.remove('light');
          }

          // Belt-and-suspenders: some browsers don't repaint CSS variables
          // immediately on OS-level theme flips. Nudge them by toggling a
          // no-op attribute when the system preference changes (only while
          // the user hasn't pinned a theme).
          var mql = window.matchMedia('(prefers-color-scheme: dark)');
          var on_system_change = function () {
            if (localStorage.getItem('gutenberg-theme')) return;
            root.classList.remove('dark');
            root.classList.remove('light');
          };
          if (typeof mql.addEventListener === 'function') {
            mql.addEventListener('change', on_system_change);
          } else if (typeof mql.addListener === 'function') {
            mql.addListener(on_system_change);
          }
        } catch (e) {
          console.error(e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
