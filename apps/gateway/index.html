<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#0a0a0a"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#f4f4f0"
      media="(prefers-color-scheme: light)"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Gutenberg — publish what can&rsquo;t be erased</title>
    <meta
      name="description"
      content="Gutenberg lets anyone publish freely, privately, and permanently. Once a publication is signed and on-chain, no host, court, or platform can unpublish that version."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var saved = localStorage.getItem('gutenberg-theme');
          if (saved === 'dark') {
            root.classList.add('dark');
            root.classList.remove('light');
          } else if (saved === 'light') {
            root.classList.add('light');
            root.classList.remove('dark');
          } else {
            root.classList.remove('dark');
            root.classList.remove('light');
          }
          var mql = window.matchMedia('(prefers-color-scheme: dark)');
          var onSystemChange = function () {
            if (localStorage.getItem('gutenberg-theme')) return;
            root.classList.remove('dark');
            root.classList.remove('light');
            root.setAttribute('data-pref-refresh', String(Math.random()));
          };
          if (typeof mql.addEventListener === 'function') {
            mql.addEventListener('change', onSystemChange);
          } else if (typeof mql.addListener === 'function') {
            mql.addListener(onSystemChange);
          }
        } catch (e) {
          console.error(e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
