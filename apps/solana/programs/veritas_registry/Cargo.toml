[package]
name = "veritas_registry"
version = "0.1.0"
description = "Veritas release registry"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "veritas_registry"

[features]
anchor-debug = []
custom-heap = []
custom-panic = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []

[dependencies]
anchor-lang = "0.32.1"
solana-sha256-hasher = "2.3.0"
