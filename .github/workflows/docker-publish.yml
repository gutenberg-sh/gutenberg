name: Publish Docker images

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'docker/gutenberg/**'
      - 'docker-compose.yml'
      - 'apps/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docker-publish.yml'

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_ARGS: |
        VITE_GUTENBERG_SOLANA_RPC_URL=https://api.mainnet.solana.com
        VITE_GUTENBERG_IRYS_GATEWAY=https://node1.irys.xyz
        VITE_GUTENBERG_IRYS_NETWORK=mainnet
        VITE_GUTENBERG_ARWEAVE_MIRRORS=https://arweave.net,https://ar-io.dev,https://g8way.io,https://permagate.io
        VITE_GUTENBERG_INDEXER_URL=http://127.0.0.1:4000
        VITE_GUTENBERG_EXPLORER_URL=https://explorer.solana.com/address/{address}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/gutenberg
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile
          target: gutenberg
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=gutenberg
          cache-to: type=gha,mode=max,scope=gutenberg
          build-args: ${{ env.DOCKER_BUILD_ARGS }}

  release:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@437e073e786973c6b6af97d9e445c41ae43b1d29 # v3.4.0
        with:
          tag_name: develop-${{ github.sha }}
          name: develop ${{ github.sha }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            **Image:** `ghcr.io/${{ github.repository_owner }}/gutenberg:${{ github.sha }}` (also `latest` on this branch).
