name: Publish Docker images

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'docker/gutenberg/**'
      - 'docker-compose.yml'
      - 'apps/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docker-publish.yml'

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_ARGS: |
        VITE_GUTENBERG_SOLANA_RPC_URL=https://api.mainnet.solana.com
        VITE_GUTENBERG_IRYS_GATEWAY=https://node1.irys.xyz
        VITE_GUTENBERG_IRYS_NETWORK=mainnet
        VITE_GUTENBERG_ARWEAVE_MIRRORS=https://arweave.net,https://ar-io.dev,https://g8way.io,https://permagate.io
        VITE_GUTENBERG_INDEXER_URL=http://127.0.0.1:4000
        VITE_GUTENBERG_EXPLORER_URL=https://explorer.solana.com/address/{address}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gutenberg
            target: gutenberg
          - image: gutenberg-indexer-migrate
            target: indexer-migrate
          - image: gutenberg-indexer
            target: indexer
          - image: gutenberg-gateway
            target: gateway

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6a1c35 # v3

      - name: Log in to GHCR
        uses: docker/login-action@5e57cda17c85dc1c505c3537966285c0c565972d # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed9c899d2c43a65cc005 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@263435318d21bb52da101b6cfc6bc88fb194b6f4 # v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=gutenberg-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=gutenberg-${{ matrix.image }}
          build-args: ${{ env.DOCKER_BUILD_ARGS }}
