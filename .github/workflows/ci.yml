name: CI Pipeline

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Core
        run: pnpm run core:build

      - name: Build Gateway and Indexer
        run: |
          set -e
          pnpm run gateway:build &
          pnpm run indexer:build &
          wait

      - name: Run Linter
        run: |
          set -e
          pnpm --filter @gutenberg/core run lint &
          pnpm --filter @gutenberg/gateway run lint &
          pnpm --filter @gutenberg/indexer run lint &
          wait
